# Release Chowki to PyPI on version tag push using OIDC Trusted Publisher authentication.
name: Release Chowki to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  pypi-publish:
    name: Build and publish Python SDK
    runs-on: ubuntu-latest
    # Must match the "Environment name" on the PyPI Trusted Publisher, or the OIDC
    # exchange is rejected. It is also where a deployment protection rule (required
    # reviewer / wait timer) attaches — the only thing standing between an accidental
    # tag push and a version number that can never be reused.
    environment:
      name: pypi
      url: https://pypi.org/p/chowki
    permissions:
      id-token: write # Mandatory for OIDC authentication with PyPI
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for hatch-vcs tag discovery
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build wheel and sdist
        run: uv build --package chowki
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
