# Release Chowki to PyPI on version tag push using OIDC Trusted Publisher authentication.
name: Release Chowki to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  pypi-publish:
    name: Build and publish Python SDK
    runs-on: ubuntu-latest
    # Must match the "Environment name" on the PyPI Trusted Publisher, or the OIDC
    # exchange is rejected. It is also where a deployment protection rule (required
    # reviewer / wait timer) attaches — the only thing standing between an accidental
    # tag push and a version number that can never be reused.
    environment:
      name: pypi
      url: https://pypi.org/p/chowki
    permissions:
      id-token: write # Mandatory for OIDC authentication with PyPI
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for hatch-vcs tag discovery
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked --all-extras --dev

      # A tag push publishes permanently, so everything CI would have caught runs again
      # here rather than being assumed from a green run on some earlier commit.
      - name: Lint and type check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
      - name: Unit and integration tests
        run: uv run pytest python/chowki/tests/unit python/chowki/tests/integration -q

      - name: Build wheel and sdist
        run: uv build --package chowki

      # Refuses to publish on a tag/version mismatch, a .dev or local version, a stale
      # artifact in dist/, or a version already on PyPI. See scripts/check_release.py.
      - name: Verify the build matches the tag
        run: uv run python scripts/check_release.py --tag "${{ github.ref_name }}" --dist dist
      - name: Verify package metadata renders
        run: uv run --with twine twine check dist/*
      - name: Smoke test the built wheel
        run: uv run python scripts/wheel_smoke_test.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
