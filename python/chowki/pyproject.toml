[project]
name = "chowki"
description = "Durable execution for LLM agents: crash recovery, step memoization, human-in-the-loop approval gates, secret redaction, and token budgets. No server, no worker — just SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chowki maintainers" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Recovery Tools",
    "Typing :: Typed",
]
keywords = [
    "durable-execution", "crash-recovery", "resume", "replay", "idempotency",
    "memoization", "exactly-once", "human-in-the-loop", "hitl", "approval-workflow",
    "audit-log", "guardrails", "circuit-breaker", "loop-detection", "token-budget",
    "cost-control", "secret-redaction", "llm", "agents", "ai-agents", "llmops",
    "langchain", "langgraph", "sqlite",
]
dependencies = [
    "msgspec>=0.18.6",
    "jsonpatch>=1.33",
    "jsonpointer>=2.4",
    "cryptography>=50.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
]

[project.urls]
Homepage = "https://github.com/Git-Uzair/chowki"
Repository = "https://github.com/Git-Uzair/chowki"
Documentation = "https://github.com/Git-Uzair/chowki#readme"
Issues = "https://github.com/Git-Uzair/chowki/issues"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.27.0"]

[project.scripts]
chowki = "chowki.cli:main"

[build-system]
requires = ["hatchling>=1.32.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chowki"]

[tool.hatch.version]
source = "vcs"
# The package root is python/chowki but .git is two levels up, and setuptools-scm searches
# from the project directory only. Without this override it never finds the repository, so
# every build silently took `fallback-version` and a `v0.2.0` tag would have published
# 0.1.0 again. Verified: with the override a v9.9.9 tag builds chowki-9.9.9.
raw-options = { root = "../.." }
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/chowki/_version.py"
