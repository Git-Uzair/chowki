[project]
name = "chowki"
description = "In-process agent state preservation, guardrails, and warm resume."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chowki maintainers" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.18.6",
    "jsonpatch>=1.33",
    "jsonpointer>=2.4",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.27.0"]

[build-system]
requires = ["hatchling>=1.25.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chowki"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/chowki/_version.py"
