[project]
name = "chowki"
description = "In-process agent state preservation, guardrails, and warm resume."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chowki maintainers" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["agent", "ai", "state-preservation", "resumption", "hitl", "guardrails", "workflow", "llm"]
dependencies = [
    "msgspec>=0.18.6",
    "jsonpatch>=1.33",
    "jsonpointer>=3.1.1",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
]

[project.urls]
Homepage = "https://github.com/Git-Uzair/chowki"
Repository = "https://github.com/Git-Uzair/chowki"
Documentation = "https://github.com/Git-Uzair/chowki#readme"
Issues = "https://github.com/Git-Uzair/chowki/issues"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.27.0"]

[project.scripts]
chowki = "chowki.cli:main"

[build-system]
requires = ["hatchling>=1.31.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chowki"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/chowki/_version.py"
